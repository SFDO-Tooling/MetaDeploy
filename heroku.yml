build:
  docker:
    web: Dockerfile
  config:
    OMNIOUT_TOKEN: $OMNIOUT_TOKEN
run:
  web: daphne --bind 0.0.0.0 --port $PORT metadeploy.asgi:application
  devworker:
    image: web
    command:
      - honcho start -f Procfile_devworker
  worker:
    image: web
    command:
      - sh .heroku/start_metadeploy_worker.sh
  worker-short:
    image: web
    command:
      - honcho start -f Procfile_worker_short
release:
  image: web
  command:
    - ./.heroku/release.sh
